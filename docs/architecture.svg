<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1040" viewBox="0 0 2400 1040" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<defs>
<marker id="b" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="g" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f8624"/></marker>
<marker id="k" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="2400" height="1040" fill="#fff"/>
<rect x="180" y="20" width="2200" height="1000" rx="10" fill="none" stroke="#222" stroke-width="3"/>
<rect x="180" y="20" width="420" height="50" fill="#1f2937"/><text x="200" y="53" font-size="26" font-weight="bold" fill="#fff">AWS Cloud (서울 리전)</text>

<!-- outside actors -->
<rect x="20" y="130" width="140" height="100" rx="6" fill="#fff" stroke="#4b5563" stroke-width="3"/>
<text x="90" y="170" font-size="24" font-weight="bold" text-anchor="middle">고객</text><text x="90" y="205" font-size="18" text-anchor="middle" fill="#555">채팅 위젯</text>
<rect x="20" y="690" width="140" height="110" rx="6" fill="#fff" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 5"/>
<text x="90" y="732" font-size="22" font-weight="bold" text-anchor="middle">Colab</text><text x="90" y="762" font-size="16" text-anchor="middle" fill="#555">시연용</text><text x="90" y="784" font-size="16" text-anchor="middle" fill="#555">사례 업로드</text>

<!-- frontend -->
<rect x="200" y="80" width="420" height="560" rx="10" fill="#f8f5ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="220" y="112" font-size="22" font-weight="bold" fill="#8b5cf6">웹 프런트엔드 (엣지)</text>
<g font-size="24" font-weight="bold" text-anchor="middle">
<rect x="220" y="130" width="380" height="90" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="410" y="170">Route 53</text><text x="410" y="200" font-size="17" font-weight="normal" fill="#555">도메인 DNS</text>
<rect x="220" y="260" width="380" height="90" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="410" y="300">CloudFront</text><text x="410" y="330" font-size="17" font-weight="normal" fill="#555">HTTPS, /api 전달</text>
<rect x="220" y="400" width="380" height="90" rx="6" fill="#fff" stroke="#3f8624" stroke-width="3"/><text x="410" y="440">S3 정적 웹</text><text x="410" y="470" font-size="17" font-weight="normal" fill="#555">챗봇 위젯 페이지</text>
</g>

<!-- VPC -->
<rect x="660" y="80" width="620" height="760" rx="10" fill="#f3f9ee" stroke="#3f8624" stroke-width="2"/>
<text x="680" y="112" font-size="22" font-weight="bold" fill="#3f8624">VPC (프라이빗 서브넷, 2개 가용 영역)</text>
<rect x="680" y="130" width="580" height="90" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="3"/>
<text x="970" y="170" font-size="24" font-weight="bold" text-anchor="middle">Application Load Balancer</text>
<text x="970" y="200" font-size="17" text-anchor="middle" fill="#555">경로별 라우팅 /api/food, /api/fashion, CloudFront만 허용</text>

<g font-size="22" font-weight="bold" text-anchor="middle">
<rect x="680" y="270" width="580" height="250" rx="8" fill="none" stroke="#ea7a00" stroke-width="3" stroke-dasharray="10 6"/>
<text x="700" y="302" font-size="20" fill="#c2410c" text-anchor="start">식품관 ECS 서비스 (전용 대상 그룹, 오토스케일링)</text>
<rect x="700" y="330" width="260" height="110" rx="6" fill="#fff" stroke="#ea7a00" stroke-width="3"/><text x="830" y="372">Fargate 작업</text><text x="830" y="406" font-size="17" font-weight="normal" fill="#555">가용 영역 a, 상태 비저장</text>
<rect x="980" y="330" width="260" height="110" rx="6" fill="#fff" stroke="#ea7a00" stroke-width="3"/><text x="1110" y="372">Fargate 작업</text><text x="1110" y="406" font-size="17" font-weight="normal" fill="#555">가용 영역 c, 상태 비저장</text>
<text x="700" y="490" font-size="17" font-weight="normal" fill="#555" text-anchor="start">작업별 CPU, 메모리 예약, 최소 2개 상시 실행, 요청 수 기준 확장</text>

<rect x="680" y="560" width="580" height="250" rx="8" fill="none" stroke="#ea7a00" stroke-width="3" stroke-dasharray="10 6"/>
<text x="700" y="592" font-size="20" fill="#c2410c" text-anchor="start">패션관 ECS 서비스 (전용 대상 그룹, 오토스케일링)</text>
<rect x="700" y="620" width="260" height="110" rx="6" fill="#fff" stroke="#ea7a00" stroke-width="3"/><text x="830" y="662">Fargate 작업</text><text x="830" y="696" font-size="17" font-weight="normal" fill="#555">가용 영역 a, 상태 비저장</text>
<rect x="980" y="620" width="260" height="110" rx="6" fill="#fff" stroke="#ea7a00" stroke-width="3"/><text x="1110" y="662">Fargate 작업</text><text x="1110" y="696" font-size="17" font-weight="normal" fill="#555">가용 영역 c, 상태 비저장</text>
<text x="700" y="780" font-size="17" font-weight="normal" fill="#555" text-anchor="start">작업별 CPU, 메모리 예약, 최소 2개 상시 실행, 요청 수 기준 확장</text>
</g>

<!-- Bedrock models -->
<rect x="1320" y="80" width="1040" height="160" rx="10" fill="#f0fbf8" stroke="#0d9488" stroke-width="2"/>
<text x="1340" y="112" font-size="22" font-weight="bold" fill="#0d9488">Amazon Bedrock 모델 (두 서비스가 함께 호출)</text>
<rect x="1340" y="130" width="500" height="90" rx="6" fill="#fff" stroke="#0d9488" stroke-width="3"/><text x="1590" y="170" font-size="24" font-weight="bold" text-anchor="middle">Titan Text Embeddings V2</text><text x="1590" y="200" font-size="17" text-anchor="middle" fill="#555">임베딩 (1,024차원)</text>
<rect x="1860" y="130" width="480" height="90" rx="6" fill="#fff" stroke="#0d9488" stroke-width="3"/><text x="2100" y="170" font-size="24" font-weight="bold" text-anchor="middle">Nova Lite</text><text x="2100" y="200" font-size="17" text-anchor="middle" fill="#555">생성 모델, 근거 있을 때만 호출</text>

<!-- data rows: DynamoDB, KB, Vectors, S3 docs -->
<g font-size="20" font-weight="bold" text-anchor="middle">
<rect x="1320" y="270" width="1040" height="250" rx="8" fill="#f0fbf8" stroke="#0d9488" stroke-width="2" stroke-dasharray="10 6"/>
<text x="1340" y="302" fill="#0d9488" text-anchor="start">식품관 데이터 (식품관 작업 역할만 접근)</text>
<rect x="1340" y="330" width="235" height="110" rx="6" fill="#fff" stroke="#c026d3" stroke-width="3"/><text x="1457" y="372">DynamoDB</text><text x="1457" y="404" font-size="16" font-weight="normal" fill="#555">식품관 대화 기록</text>
<rect x="1595" y="330" width="235" height="110" rx="6" fill="#fff" stroke="#0d9488" stroke-width="3"/><text x="1712" y="372">Knowledge Base</text><text x="1712" y="404" font-size="16" font-weight="normal" fill="#555">식품관 전용</text>
<rect x="1850" y="330" width="235" height="110" rx="6" fill="#fff" stroke="#3f8624" stroke-width="3"/><text x="1967" y="372">S3 Vectors</text><text x="1967" y="404" font-size="16" font-weight="normal" fill="#555">식품관 인덱스</text>
<rect x="2105" y="330" width="235" height="110" rx="6" fill="#fff" stroke="#3f8624" stroke-width="3"/><text x="2222" y="372">S3 문서</text><text x="2222" y="404" font-size="16" font-weight="normal" fill="#555">food/, food/cases/</text>

<rect x="1320" y="560" width="1040" height="250" rx="8" fill="#f0fbf8" stroke="#0d9488" stroke-width="2" stroke-dasharray="10 6"/>
<text x="1340" y="592" fill="#0d9488" text-anchor="start">패션관 데이터 (패션관 작업 역할만 접근)</text>
<rect x="1340" y="620" width="235" height="110" rx="6" fill="#fff" stroke="#c026d3" stroke-width="3"/><text x="1457" y="662">DynamoDB</text><text x="1457" y="694" font-size="16" font-weight="normal" fill="#555">패션관 대화 기록</text>
<rect x="1595" y="620" width="235" height="110" rx="6" fill="#fff" stroke="#0d9488" stroke-width="3"/><text x="1712" y="662">Knowledge Base</text><text x="1712" y="694" font-size="16" font-weight="normal" fill="#555">패션관 전용</text>
<rect x="1850" y="620" width="235" height="110" rx="6" fill="#fff" stroke="#3f8624" stroke-width="3"/><text x="1967" y="662">S3 Vectors</text><text x="1967" y="694" font-size="16" font-weight="normal" fill="#555">패션관 인덱스</text>
<rect x="2105" y="620" width="235" height="110" rx="6" fill="#fff" stroke="#3f8624" stroke-width="3"/><text x="2222" y="662">S3 문서</text><text x="2222" y="694" font-size="16" font-weight="normal" fill="#555">fashion/, fashion/cases/</text>
</g>

<!-- monitoring -->
<rect x="660" y="870" width="1700" height="130" rx="10" fill="#fff5f8" stroke="#e11d63" stroke-width="2"/>
<text x="680" y="902" font-size="22" font-weight="bold" fill="#e11d63">모니터링 및 보안</text>
<g font-size="22" font-weight="bold" text-anchor="middle">
<rect x="680" y="916" width="520" height="70" rx="6" fill="#fff" stroke="#e11d63" stroke-width="3"/><text x="940" y="946">CloudWatch</text><text x="940" y="974" font-size="16" font-weight="normal" fill="#555">서비스별 지표, 로그, 알람</text>
<rect x="1220" y="916" width="520" height="70" rx="6" fill="#fff" stroke="#e11d63" stroke-width="3"/><text x="1480" y="946">CloudTrail</text><text x="1480" y="974" font-size="16" font-weight="normal" fill="#555">API 감사 로그</text>
<rect x="1760" y="916" width="580" height="70" rx="6" fill="#fff" stroke="#e11d63" stroke-width="3"/><text x="2050" y="946">IAM 역할, VPC 엔드포인트</text><text x="2050" y="974" font-size="16" font-weight="normal" fill="#555">서비스별 작업 역할, 대화 기록은 쓰기만</text>
</g>

